version: "3.9"

services:
  api:
    build: .
    container_name: chat-api
    env_file: .env.docker
    ports:
      - "8080:8000"

    depends_on:
      - redis
    volumes:
      - ./chat_api_db:/app/chat_api_db
    
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"